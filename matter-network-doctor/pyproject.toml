[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matter-network-doctor"
version = "0.1.0"
description = "Local Matter and Thread network readiness diagnostics for Home Assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Matter Network Doctor contributors" }
]
dependencies = [
  "httpx>=0.27.0",
  "psutil>=5.9.0",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "zeroconf>=0.132.0"
]

[project.scripts]
matter-network-doctor = "matter_network_doctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/matter_network_doctor"]

